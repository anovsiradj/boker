<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Boker - URL Blocker</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --danger: #ea4335;
      --danger-hover: #c5221f;
      --bg: #fff;
      --text: #202124;
      --text-secondary: #5f6368;
      --border: #e0e0e0;
      --surface: #f8f9fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --text: #e8eaed;
        --text-secondary: #9aa0a6;
        --border: #3c4043;
        --surface: #292a2d;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 420px;
      min-height: 500px;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
    }
    h1 { font-size: 20px; margin: 0 0 20px; font-weight: 500; }
    .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="url"] {
      flex: 1; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 14px; background: var(--surface); color: var(--text);
    }
    input[type="url"]:focus { outline: none; border-color: var(--primary); }
    button {
      padding: 10px 18px; background: var(--primary); color: white; border: none;
      border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500;
      transition: background 0.2s;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: var(--border); }
    button.danger { background: var(--danger); }
    button.danger:hover { background: var(--danger-hover); }
    .btn-group { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    #status { min-height: 22px; font-size: 13px; margin: 8px 0; color: var(--text-secondary); }
    #status.error { color: var(--danger); }
    #status.success { color: #1e8e3e; }
    .divider { border-top: 1px solid var(--border); margin: 16px 0; }
    .blocked-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }
    .blocked-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    .blocked-item:last-child { border-bottom: none; }
    .domain-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .domain-name { font-size: 14px; word-break: break-all; }
    .domain-sub { font-size: 11px; color: var(--text-secondary); }
    .remove-btn {
      padding: 6px 10px; background: var(--danger); color: white; font-size: 12px;
      white-space: nowrap;
    }
    .empty-state { color: var(--text-secondary); font-size: 14px; text-align: center; padding: 32px; }
    .help-text { font-size: 12px; color: var(--text-secondary); margin-top: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Boker - URL Blocker</h1>
  <div class="input-group">
    <input type="url" id="urlInput" placeholder="https://example.com/path" />
    <button id="addBtn">Block URL</button>
  </div>
  <div class="btn-group">
    <button id="exportBtn" class="secondary">Export DB</button>
    <button id="importBtn" class="secondary">Import DB</button>
    <input type="file" id="importFile" accept=".json" style="display: none" />
  </div>
  <div id="status"></div>
  <div class="divider"></div>
  <ul id="blockedList" class="blocked-list"></ul>
  <p class="help-text">Enter a full URL (e.g., https://sub.example.com/path). The hostname is extracted and blocked via declarativeNetRequest.</p>
  <script type="module" src="index.ts"></script>
</body>
</html>
